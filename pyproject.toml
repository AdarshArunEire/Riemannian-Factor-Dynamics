[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riemannian-factor-dynamics"
version = "0.1.0"
description = "Factor models for manifold-valued time series with a moving baseline"
readme = "README.md"
authors = [{name = "Adarsh Arun"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
experiments = ["pandas>=2", "matplotlib>=3.7", "PyYAML>=6", "requests>=2"]
test = ["pytest>=7", "pandas>=2", "matplotlib>=3.7", "PyYAML>=6", "requests>=2"]

[tool.setuptools.packages.find]
include = ["rfd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
