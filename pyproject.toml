[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riemannian-factor-dynamics"
version = "0.1.0"
description = "Moving-centre factor models for manifold-valued time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "pandas>=2"]
data = ["pandas>=2"]
test = ["pytest>=7", "pandas>=2", "matplotlib>=3.7", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["py"]
include = ["rfd*"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]
pythonpath = ["py"]
