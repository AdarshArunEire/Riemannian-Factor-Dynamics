# B4.5 / N-01 operational configuration for the first complete RFD run.
#
# The two estimator variants always share the same generated sample.  The
# production multiplier is clipped for small n but has the fixed asymptotic
# cap 2.1; the reference remains 1.3.  Neither rule is changed after final
# evaluation losses are visible.

experiment:
  id: B4.5-end-to-end
  root_seed: 20260821
  geometry: airm
  base_condition: 1.6
  drift_scale: 0.35
  centre_profile: cubic
  factor_rank: 2
  factor_persistence: [0.80, 0.55]
  factor_scale: [0.35, 0.25]
  noise_scale: 0.20
  noise_persistence: 0.0
  noise_constant_norm: true
  loading_orientation: random
  loading_structure: dense

estimator:
  bandwidth_exponent: 0.14285714285714285       # 1/7
  bandwidth_constant: 0.5
  production_multiplier_cap: 2.1
  admissible_boundary_fraction: 0.95
  reference_multiplier: 1.3
  polygon_rate_exponent: 0.42857142857142855    # centre error 3/7
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 100
  max_lag: 2
  tail_mode: common
  normalization: row_size
  # tau_n = selector_constant * n^(-selector_exponent).  This is a declared
  # finite-sample selector diagnostic; the fixed-rank fit keeps reconstruction
  # error separate from selector error in the baseline theorem check.
  selector_constant: 0.01
  selector_exponent: 0.42857142857142855
  selector_max_rank: 5

analysis:
  minimum_success_fraction: 0.95
  slope_fit_n_min: 512
  bootstrap_replicates: 1000

profiles:
  smoke:
    recorded: false
    seed_namespace: 4500
    output_dir: tmp/end_to_end_smoke
    n_values: [128]
    matrix_sizes: [2]
    replicates: 1

  factor_baseline:
    recorded: true
    seed_namespace: 4501
    output_dir: results/intermediate/end_to_end_factor_baseline
    n_values: [512, 1024, 2048, 4096]
    matrix_sizes: [2, 3, 4]
    replicates: 32
