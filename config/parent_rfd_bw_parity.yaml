# Literal parent RFM versus RFD on paired regular Bures--Wasserstein draws.
#
# Every task supplies the known DGP rank to both methods.  Rank selection and
# forecasting are deliberately absent: this experiment isolates the cost or
# benefit of RFD's moving-centre, polygon, and transport machinery.

experiment:
  id: P1-PARENT-RFD-BW-PARITY
  root_seed: 20260825
  geometry: bw
  matrix_size: 3
  base_condition: 1.6
  factor_rank: 2
  factor_persistence: [0.80, 0.55]
  factor_scale: [0.10, 0.075]
  noise_scale: 0.06
  noise_constant_norm: true
  loading_structure: dense

estimator:
  bandwidth_constant: 0.5
  bandwidth_multiplier: 1.3
  bandwidth_exponent: 0.14285714285714285
  polygon_rate_exponent: 0.42857142857142855
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 150
  max_lag: 2
  tail_mode: common
  normalization: row_size

parent:
  batch_size: 16
  budget_iterations: 16
  sensitivity_mean_tolerance: 1.0e-10
  sensitivity_mean_max_iterations: 200

regimes:
  P-HOME:
    # Identity-centred geometric home field.  It deliberately retains the
    # project's common factor/noise generator so all six regimes admit paired
    # component controls; it is not a byte-for-byte replay of dta_gen_BWS.
    label: parent-style identity-centred home field
    class: home_field
    path: commuting
    base_condition: 1.0
    drift_scale: 0.0
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense

  R-FIXED:
    label: conditioned fixed-centre RFD control
    class: fixed_control
    path: commuting
    base_condition: 1.6
    drift_scale: 0.0
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense

  M-ALIGNED:
    label: moving centre aligned with loading space
    class: moving
    path: commuting
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: aligned
    drift_overlap: 1.0
    loading_structure: dense

  M-MIXED:
    label: moving centre partly overlaps loading space
    class: moving
    path: commuting
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: mixed
    drift_overlap: 0.7071067811865476
    loading_structure: dense

  M-ORTHOGONAL:
    label: moving centre orthogonal to loading space
    class: moving
    path: commuting
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: orthogonal
    drift_overlap: 0.0
    loading_structure: dense

  M-CURVED:
    label: noncommuting curved moving centre
    class: moving_curved
    path: curved
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense

profiles:
  smoke:
    recorded: false
    seed_namespace: 4900
    output_dir: tmp/parent_rfd_bw_parity_smoke_v4
    n_values: [128]
    replicates: 1
    regimes: [P-HOME, M-ORTHOGONAL]

  overnight:
    recorded: true
    seed_namespace: 4910
    output_dir: results/intermediate/parent_rfd_bw_parity
    n_values: [240, 512, 2048, 8192]
    replicates: 24
    regimes: [P-HOME, R-FIXED, M-ALIGNED, M-MIXED, M-ORTHOGONAL, M-CURVED]
