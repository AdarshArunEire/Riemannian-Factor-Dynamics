# B4.2 / N-LS-A operational configuration.
#
# Scientific choices consumed by a recorded run are locked in
# config/predeclaration.yaml.  This file gives the runner concrete values and
# keeps the smoke, headline-rate, and discrepancy workloads visibly separate.

experiment:
  id: B4.2-centre-rate
  root_seed: 20260816
  geometry: airm
  matrix_size: 3
  base_eigenvalues: [1.0, 1.25, 1.6]
  drift_direction_diagonal: [-1.0, 0.25, 0.75]
  centre_profile: cubic
  drift_scale: 0.35
  noise_scale: 0.25
  noise_persistence: 0.0
  noise_constant_norm: true
  factor_rank: 0

estimator:
  bandwidth_exponent: 0.14285714285714285   # 1/7
  bandwidth_constant: 0.5
  polygon_rate_exponent: 0.42857142857142855 # 3/7
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 100

discrepancy:
  amplitude: 0.5
  profile: smooth_coherent

analysis:
  primary_metric: path_rms
  reference_slope: -0.42857142857142855
  compatibility_band: [-0.50, -0.36]
  minimum_success_fraction: 0.95

profiles:
  smoke:
    recorded: false
    output_dir: tmp/centre_rate_smoke
    n_values: [128, 256]
    replicates: 1
    bandwidth_multipliers: [1.0]
    regimes: [bias_only, full, discrepancy_coherent]
    discrepancy_exponents: [0.25]
    slope_fit_n_min: 128
    bootstrap_replicates: 50

  centre_rate:
    recorded: true
    output_dir: results/intermediate/centre_rate
    n_values: [256, 512, 1024, 2048, 4096, 8192]
    replicates: 64
    bandwidth_multipliers: [0.7, 1.0, 1.3]
    regimes: [bias_only, variance_only, full]
    discrepancy_exponents: []
    slope_fit_n_min: 1024
    bootstrap_replicates: 2000

  discrepancy:
    recorded: true
    output_dir: results/intermediate/local_stationarity_discrepancy
    n_values: [256, 512, 1024, 2048, 4096, 8192]
    replicates: 64
    bandwidth_multipliers: [1.0]
    regimes: [discrepancy_coherent]
    discrepancy_exponents:
      - 0.2
      - 0.2857142857142857       # 2/7
      - 0.3333333333333333       # 1/3
      - 0.42857142857142855      # 3/7 transition
      - 0.5
      - infinity
    slope_fit_n_min: 1024
    bootstrap_replicates: 2000
