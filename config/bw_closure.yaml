# Paper 1 compact fixed-size Bures--Wasserstein closure matrix.
#
# This file is the immutable workload declaration copied beside every output.
# Safe cells test the complete robust-rate chain. Hostile cells isolate a
# single theorem boundary and pass only by a declared rejection or fallback.

experiment:
  id: P1-BW-CLOSE
  root_seed: 20260824
  geometry: bw
  matrix_size: 3
  base_condition: 1.6
  factor_rank: 2
  factor_persistence: [0.80, 0.55]
  factor_scale: [0.10, 0.075]
  noise_scale: 0.06
  noise_constant_norm: true
  loading_structure: dense

estimator:
  # Frozen robust-rate bandwidth: 0.5 * 1.3 * n^(-1/7).
  bandwidth_constant: 0.5
  bandwidth_multiplier: 1.3
  bandwidth_exponent: 0.14285714285714285
  polygon_rate_exponent: 0.42857142857142855
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 150
  max_lag: 2
  tail_mode: common
  normalization: row_size
  selector_constant: 0.01
  selector_exponent: 0.42857142857142855
  selector_max_rank: 5

# Predeclared empirical regular domain. These are experimental membership
# gates, not claimed sharp constants for the analytical normal radius.
domain:
  spectral_lower: 0.005
  spectral_upper: 12.0
  polar_singular_lower: 0.01
  exp_factor_singular_lower: 0.01
  score_radius_upper: 2.0
  path_length_upper: 3.0

rate_regimes:
  R-COMM:
    label: commuting diagonal BW-flat rate spine
    class: rate
    mode: fit
    path: commuting
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: commuting
    expected: safe

  R-CURVED:
    label: noncommuting curved BW rate spine
    class: rate
    mode: fit
    path: curved
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense
    expected: safe

scientific_regimes:
  S-FIXED:
    label: fixed centre with persistent factors
    class: scientific
    mode: fit
    path: commuting
    drift_scale: 0.0
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: commuting
    expected: safe

  S-NOFACTOR:
    label: moving centre without persistent factors
    class: scientific
    mode: fit
    path: curved
    drift_scale: 0.20
    rank: 0
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense
    expected: safe

  S-ALIGNED:
    label: aligned drift and loading span
    class: scientific
    mode: fit
    path: commuting
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: aligned
    loading_structure: commuting
    drift_overlap: 1.0
    expected: safe

  S-MIXED:
    label: mixed drift and loading span
    class: scientific
    mode: fit
    path: curved
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: mixed
    loading_structure: dense
    drift_overlap: 0.7071067811865476
    expected: safe

  S-ORTHOGONAL:
    label: orthogonal drift and loading span
    class: scientific
    mode: fit
    path: curved
    drift_scale: 0.20
    rank: 2
    noise_scale: 0.06
    noise_persistence: 0.0
    loading_orientation: orthogonal
    loading_structure: dense
    drift_overlap: 0.0
    expected: safe

hostile_regimes:
  H-LOWER:
    label: shrinking finite-size lower spectral margin
    class: hostile_fit
    mode: fit
    path: curved
    base_condition: 10000.0
    drift_scale: 0.001
    rank: 2
    factor_scale: [0.002, 0.0015]
    noise_scale: 0.001
    noise_persistence: 0.0
    loading_orientation: random
    loading_structure: dense
    expected: boundary

  H-SIGNED:
    label: signed Richardson leaves compatible BW branch
    class: hostile_probe
    mode: signed_exit
    expected: fallback

  H-NEAR:
    label: near-identical BW distance cancellation
    class: hostile_probe
    mode: near_identical
    expected: finite

  H-RANKLOSS:
    label: rank-deficient input leaves full-rank theorem
    class: hostile_probe
    mode: rank_loss
    expected: reject

  H-EXP:
    label: incompatible BW exponential factor
    class: hostile_probe
    mode: exp_exit
    expected: reject

  H-DISPERSION:
    label: fixed conditioning with increasing noncommuting dispersion
    class: hostile_probe
    mode: dispersion
    expected: finite

profiles:
  smoke:
    recorded: false
    seed_namespace: 4800
    output_dir: tmp/bw_closure_smoke_v3
    workloads:
      rate:
        regimes: [R-COMM, R-CURVED]
        n_values: [128]
        replicates: 1
      scientific:
        regimes: [S-NOFACTOR]
        n_values: [128]
        replicates: 1
      hostile:
        regimes: [H-LOWER, H-SIGNED, H-NEAR, H-RANKLOSS, H-EXP, H-DISPERSION]
        n_values: [128]
        replicates: 1

  bw_closure:
    recorded: true
    seed_namespace: 4810
    output_dir: results/intermediate/bw_closure
    workloads:
      rate:
        regimes: [R-COMM, R-CURVED]
        n_values: [512, 1024, 2048, 4096, 8192]
        replicates: 16
      scientific:
        regimes: [S-FIXED, S-NOFACTOR, S-ALIGNED, S-MIXED, S-ORTHOGONAL]
        n_values: [512, 2048, 8192]
        replicates: 16
      hostile:
        regimes: [H-LOWER, H-SIGNED, H-NEAR, H-RANKLOSS, H-EXP, H-DISPERSION]
        n_values: [512, 2048]
        replicates: 8
