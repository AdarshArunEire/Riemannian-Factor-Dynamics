# =====================================================================
# PREDECLARATION
#
# Written before any experiment runs. This file is what makes the
# numbers evidence rather than decoration.
#
# THE RULE: append-only.
#   - Adding a new entry, or a dated amendment to an existing one, is fine.
#   - Editing or deleting a committed line is not.
#   - An amendment made AFTER seeing a result must say so and give the
#     reason. An amendment made on evidence INDEPENDENT of the outcome
#     (e.g. a calibration measurement) should say that too.
#
# created: 2026-08-16
# =====================================================================

meta:
  created: 2026-08-16
  root_seed: 20260816          # arbitrary by design; fixed in advance is the point
  seed_derivation: >
    One root. Per-experiment and per-stream seeds are derived with
    numpy SeedSequence.spawn, which constructs independent streams
    rather than merely probably-independent ones. Train, validation
    and test draw from separate spawned roots so that nothing is
    evaluated on draws it was tuned against.
  amendments:                  # append dated entries here; never edit above

    - date: 2026-08-17
      section: N18a.criterion
      kind: outcome-independent
      title: provisional tolerances superseded by measurement
      why_legitimate: >
        N-18a's calibration block required this: measure achievable
        precision on this machine's BLAS, then set the tolerance one order
        above the measured spread, and if that disagrees with the
        provisional values THE MEASUREMENT WINS. The measurement makes no
        reference to any result we would prefer, so this revision is
        outcome-independent and does not weaken the falsifier.
      superseded:
        rtol: 1.0e-10
        atol: 1.0e-14
        note: elementwise, hand-chosen, never measured
      now: >
        Test statistic is the RELATIVE Frobenius residual
        ||X - ref||_F / ||ref||_F, not an elementwise comparison. An
        elementwise relative test is not what backward stability bounds:
        it divides a norm-scale error by an individual entry, so it fails
        on small entries for reasons that carry no information.
        Tolerance is num_tol(amplification) = safety * eps * amplification
        with safety = 10, and amplification set per identity by the
        worst-conditioned INTERMEDIATE quantity in the formula:
          exp(log S) = S      amplification 1        (forward composition)
          R R = S             amplification 1        (forward composition)
          Ri S Ri = I         amplification kappa
          X # Y = Y # X       amplification kappa**2
      basis:
        artifact: results/final/spd_calibration.md
        generator: experiments/calibrate_spd.py
        measured_on: Intel64 Family 6 Model 165 (i7-10700), Windows 11, numpy 2.5.2
        max_implied_constant: 2.23
        headroom_at_safety_10: 4.5x
        note: >
          BLAS-dependent. Re-run the generator and append a further
          amendment if numpy, the BLAS, or the primitives change.

    - date: 2026-08-17
      section: N18a.derived_output / forward reference to B1.3 (AIRM)
      kind: recorded-constraint
      title: float64 ceiling on the two-point geometric mean
      finding: >
        g_mean via A^(1/2) (A^(-1/2) B A^(-1/2))^(1/2) A^(1/2) loses accuracy
        as eps * kappa**2, not eps * kappa, because the intermediate
        sandwiches a DIFFERENT matrix and nothing cancels. At kappa ~ 1e8 the
        product eps*kappa**2 ~ 1: the intermediate goes numerically
        indefinite and spd_sqrt's strict guard raises before any number is
        returned. Measured relative symmetry error at kappa = 1e5 is already
        ~1e-7.
      consequence: >
        This is a property of THIS FORMULA, not of the geometric mean.
        Better-conditioned formulations exist (Cholesky-based; generalized
        eigenproblem of the pencil (A,B), which is symmetric in its
        arguments by construction) -- see Iannazzo, arXiv:1201.0101, and the
        2024 Acta Sci. Math. survey. B1.3 should choose the formulation
        deliberately rather than inherit this one, since AIRM barycentres
        are built on it and empirical covariance matrices are not always
        well conditioned.
      open_question: >
        Symmetry error at m=12 is ~100x SMALLER than at m=2,3 for the same
        kappa. Higher dimension performing better is backwards. Hypothesis:
        geomspace puts all spectral mass at the two extremes when m=2, which
        is the worst case for the sandwich, while m=12 has moderating
        interior eigenvalues. If so, kappa alone does not determine
        difficulty and the sweep is confounding two factors -- which is the
        same reason N-19 declares three spectra rather than one. Not yet
        tested.

    - date: 2026-08-17
      section: N18a.criterion.rule
      kind: syntax-repair
      title: quoted the rule string so the file parses
      detail: >
        The line read  rule: |D_obs - D_pred| <= ...  . In YAML a bare | in
        value position opens a literal block scalar, so the file had never
        been valid YAML and no tool could read the predeclaration. The
        string is now quoted. Character content is unchanged; this is a
        parser fix, not a change of criterion. Recorded here because the
        append-only rule covers committed lines regardless of how harmless
        the edit looks.

    - date: 2026-08-18
      section: N00.established_fact
      kind: correction-of-fact
      title: the parent DOES call set.seed -- the conclusion survives, the reason does not
      was: >
        "Neither simulation_main.R nor BWS_simulation.R calls set.seed().
        Exact reproduction was never available."
      actually: >
        sim_do.R -- the driver -- calls set.seed(5566 + type) for type in 1:4
        before sourcing BWS_simulation.R. sp500_reproduce.R calls set.seed(1).
        simulation_main.R (the SPHERE study, not the SPD one) does not, and
        sp500_analysis.R does not.
      why_the_conclusion_still_holds: >
        BWS_simulation.R runs its 300 replicates inside foreach(...) %dopar% on
        a 12-worker makeCluster. A master-side set.seed does not propagate to
        parallel workers; that needs clusterSetRNGStream or doRNG, neither of
        which is used. .inorder = FALSE compounds it. The randomness therefore
        happens in unseeded workers and exact reproduction of the simulation
        tables is still unavailable. A numeric mismatch remains not a failure of
        this project.
      but_note: >
        sp500_reproduce.R is a different case -- seeded, single-threaded, and its
        only randomness is the mini-batch sampling inside mean_on_BWS
        (batch_size = 30). That script may be exactly reproducible, and it, not
        sp500_analysis.R, is the one to run.
      why_this_matters: >
        The old wording was a claim about their code that their code contradicts
        on line 2 of a four-line file. A referee who opened sim_do.R would have
        found it. Corrected on evidence, before any result was seen.
      source: reference/AUDIT.md section 6, commit c07d49c

    - date: 2026-08-18
      section: N00.highest_value_check
      kind: correction-of-fact
      title: competitor set was mis-stated, and the check needs no new code
      was: >
        "determine which loss ranks RFM against LFM/LOCF/EWMA"
      actually: >
        Two different comparisons live in their code. IN-SAMPLE / test-set fit
        (main_BWS) is RFM vs LYB only -- one competitor, the Lam-Yao-Bathia
        linear factor model on vectorised SPD data. OUT-OF-SAMPLE forecasting
        (sp500_reproduce.R) is RFM (r=2) vs LFM (r=1) vs LOCF vs EWMA(lambda
        0.94), over the last 36 of 240 months.
      the_check_is_already_computed: >
        main_BWS returns FVU_RFM_BWS, FVU_LYB_BWS, FVU_RFM_Euc and FVU_LYB_Euc --
        both metrics, both models, one call. The P1-LOSS question is whether the
        BW-ranked and Frobenius-ranked orderings ever disagree along the
        factor-count axis, and answering it means reading four vectors they
        already produce. No reimplementation needed.
      caveat_found_while_reading: >
        Before a BW distance is taken of an LYB prediction it is pushed onto the
        cone by project_to_SPD(x_hat, 1e-6); the Frobenius comparison uses the
        raw prediction. The two losses are therefore not scoring identical
        objects, and the repair can only help the linear model on the BW side.
        Any disagreement found must be checked against this before it is
        attributed to P1-LOSS.
      also: >
        RFM is given r=2 and LFM r=1 in the out-of-sample comparison, so they are
        not matched on capacity. GMV weights come from the previous month's
        realised covariance, identically for all four models, so that comparison
        varies only the risk forecast and not the portfolio.
      source: reference/AUDIT.md sections 4 and 9, commit c07d49c

    - date: 2026-08-18
      section: N00 (panel acceptance tolerance)
      kind: outcome-independent-of-the-claim
      title: acceptance tolerance for the reproduction, split bulk vs tail
      what_is_being_fixed: >
        How close our rebuilt 12-stock RC panel must bring the published
        out-of-sample numbers before any result computed on it counts as
        evidence. No such tolerance had been committed; N00 covered the
        SIMULATIONS only.
      value:
        bulk: 2%      # BW distance, Frobenius distance
        tail: 6%      # GMV risk prediction error
        applies_to: mean and median, against arXiv:2607.28385v1 Figures 3 and 4
      why_two_numbers: >
        BW and Frobenius are dominated by the LARGEST eigenvalues of the
        realised covariances. The GMV risk error runs through
        1/(1' Sigma^-1 1) and is dominated by the SMALLEST. They are
        different claims about the panel and a single band would either
        be vacuous for the bulk or unmeetable for the tail. Holding them
        to one number would hide exactly the structure that D4 found.
      why_legitimate: >
        Both numbers are read off LOCF and EWMA. Neither fits anything --
        no Frechet mean, no factor count, no seed, no convergence -- so
        neither can be tuned toward a result we would prefer, and neither
        involves our estimator or theirs. The tolerance is therefore fixed
        BEFORE the first RFM comparison and is independent of the claim it
        will later be used to judge. Chosen after seeing an RFM comparison
        it would not be, and this entry exists so that ordering is on the
        record.
      basis:
        artifacts:
          - results/final/panel_vs_parent.md
          - results/final/diag_risk_gap.md
          - results/final/diag_day_count.md
        generators:
          - experiments/check_panel_vs_parent.py
          - experiments/diag_risk_gap.py
          - experiments/diag_day_count.py
        measured:
          variant: adjusted close (closer than raw on every statistic)
          full_panel_21_days: {worst_bulk_gap: 2.4%, worst_tail_gap: 23.7%}
          at_K20_19p9_days:   {worst_bulk_gap: 1.5%, worst_tail_gap: 5.3%}
        reading: >
          Set at the best achieved, rounded up: 1.5% -> 2%, 5.3% -> 6%.
          This is the closest this panel can get to theirs, so nothing
          downstream may be held to a tighter standard.
      irreducible_floors:
        - >
          Their figures print to 2 decimals, which is +-0.5% on a value of
          1.0 and less on larger ones.
        - >
          Yahoo revises history. A 2026 pull is not byte-identical to
          whatever they downloaded, whatever else is matched.
      caveat_that_must_travel_with_this: >
        K=20 is NOT a determination of their M. The sweep is non-monotonic
        -- K=17 gives a tail gap of 8.8% and K=18 worsens it to 27.2% --
        so the finding is "consistent with ~20 effective trading days per
        month", stated as a band. The mechanism (universe-wide missing-day
        dropping before the twelve tickers are sliced out) is a HYPOTHESIS
        consistent with the measurements, not something read off their
        code. See reference/AUDIT.md section 2b.
      what_falsifies_the_day_count_story: >
        If B3.4b reproduces their RFM and LFM numbers at the full 21 days
        and fails at 20, the day-count explanation is wrong and the three
        remaining suspects come back on the table: within-month demeaning,
        returns crossing month boundaries, and winsorising or fill applied
        before the covariance.


# ---------------------------------------------------------------------
# GLOBAL — what happens when a check fails
# ---------------------------------------------------------------------
kill_criteria:
  principle: >
    Every failure has three possible causes: a code bug, a test-design
    error, or a real problem with the theorem. The first two are cheaper
    and more comfortable, so every failure will look like one of them
    first. Usually it will be. The procedure exists so that the third
    stays on the table.

  procedure:
    - step: 1
      name: log before debugging
      detail: >
        Record timestamp, experiment, cell, observed value, predicted
        value, and your first hypothesis — BEFORE any debugging begins.
        This is the load-bearing step. It makes later explaining-away
        visible rather than silently absorbed.
      writes_to: results/final/failure_log.md

    - step: 2
      name: obvious-bug pass
      detail: Normal debugging. If it resolves, record what it was.

    - step: 3
      name: stability test
      detail: >
        If it survives step 2, check whether the failure reproduces
        across (a) different seeds, (b) different spectra or DGP
        parameters, and (c) a second independent implementation of the
        same quantity. Stability across all three is the evidence that
        separates a real problem from an artefact.

    - step: 4
      name: escalate
      detail: >
        A failure stable under all three variations marks the affected
        theorem UNDER AUDIT in the proof ledger, and the dependent paper
        claim is suspended until resolved. The fix is never to widen the
        tolerance.


# ---------------------------------------------------------------------
# N-19 — evaluation-loss distortion (P1-LOSS §3–§4)
# ---------------------------------------------------------------------
N19:
  status: predeclared
  kind: monte-carlo
  purpose: >
    Falsifier for the P1-LOSS closed forms. Measures the finite-sample
    size of an already-proved distortion. Cannot prove anything; can
    only fail.

  claims:
    C1: Frobenius barycentre of the proxy law equals Sigma (no distortion)
    C2: AIRM barycentre equals c*Sigma with c = 1 - (m+1)/(2M)
    C3: >
      BW barycentre is diagonal in Sigma's eigenbasis with per-eigenvalue
      defect |B_ii|/lambda_i = (1/M)[1/4 + sum_k lam_k^2/(lam_i+lam_k)^2]
    C4: multivariate QLIKE is minimised at Sigma
    C5: a non-Wishart proxy rotates the induced BW eigenbasis; Wishart does not

  criterion:
    type: monte-carlo-standard-error
    rule: PASS if |observed - predicted| < 3 * SE
    se_estimate: sd across the R independent streams, divided by sqrt(R)
    rationale: >
      Self-scaling. C2 and C3 are asymptotic expansions in 1/M and the
      grid deliberately includes cells where 1/M is not small — at
      m=12, M=21 the AIRM correction is ~0.31. A flat relative tolerance
      would be too harsh there and vacuous at M=1638, where the true
      defect is ~0.05% and any relative test measures noise.

  budget:
    streams_R: 20
    draws_per_stream_n: 50000
    allocation: flat across all cells
    known_limitation: >
      Power is NOT uniform. Proxy spread is ~sqrt(2/M) while the defect
      is O(1/M), so the signal-to-noise ratio falls as M grows. At
      m=3, M=1638 this is roughly 3x and the cell is a weak check.
      This must be REPORTED, not hidden: state the smallest defect each
      cell could have resolved.

  grid:
    m: [3, 12]
    M: [21, 78, 1638]          # M=21 with m=12 is the flagship (12 assets, monthly RC)
    spectra:
      - name: near-flat
        condition_number: ~2
      - name: moderate
        condition_number: ~10
      - name: equity-like
        condition_number: ~50
        detail: one dominant eigenvalue plus a decaying tail
    eigenbasis: >
      Random rotation, NOT the identity — otherwise "diagonal in Sigma's
      eigenbasis" is an artefact of the starting point rather than a test.

  open_action: >
    The canon quotes 8.8–35.9% for the BW distortion at m=12, M=21.
    That range is spectrum-dependent. Either recover the spectrum that
    produced it, or restate the figure against one of the three declared
    spectra above. A referee recomputing it with their own Sigma will
    get a different number and will ask.

  implementation_note: >
    The barycentre loop must be batched — numpy.linalg.eigh accepts
    stacked (n, m, m) arrays. A Python loop over 50000 matrices is
    roughly 100x slower and makes this grid unaffordable.


# ---------------------------------------------------------------------
# N-18a — rank-inflation witnesses (ID-8)
# ---------------------------------------------------------------------
N18a:
  status: predeclared
  kind: deterministic          # no seeds, no streams, no standard errors
  purpose: >
    Code verification against theorems already proved analytically.
    Agreement confirms the implementation; disagreement indicts the code.
    Neither outcome can alter ID-8.

  constructions:
    - BW on SPD(2), x = diag(a,1), V off-diagonal, a != 1
    - AIRM on SPD(2), noncommuting
    - H^2
    - diagonal-BW rigid control (must NOT inflate)

  criterion:
    type: allclose-pair
    rule: "|D_obs - D_pred| <= atol + rtol * |D_pred|"
    rtol: 1.0e-10              # PROVISIONAL — see calibration below
    atol: 1.0e-14              # PROVISIONAL — see calibration below
    rationale: >
      Relative where the defect is healthy, absolute floor where it is
      not. A purely relative test breaks as a -> 1, because D_pred -> 0
      there — the same trap as M=1638 in N-19.

  calibration:
    required: true
    when: before the first comparison run
    method: >
      Compute D_pred two mathematically equivalent ways and measure how
      far apart they land. This measures achievable precision on this
      machine's BLAS and makes NO reference to D_obs.
    then: >
      Set rtol one order of magnitude above the measured spread and atol
      one order above the measured floor. If this disagrees with the
      provisional values above, THE MEASUREMENT WINS — record the
      supersession as a dated amendment. This is an outcome-independent
      revision and is therefore legitimate.

  derived_output:
    detectability_boundary: >
      atol also defines where the effect is numerically dead: the a-value
      at which D_pred falls below atol. Report it. It is the difference
      between "rank inflation is universal in curvature" (a theorem, true
      everywhere) and "rank inflation is detectable" (an empirical
      question) — and the second is what P-DRIFT case 3 relies on when it
      reaches real data.


# ---------------------------------------------------------------------
# N-00 — parent reproduction
# ---------------------------------------------------------------------
N00:
  status: predeclared
  established_fact: >
    Neither simulation_main.R nor BWS_simulation.R calls set.seed().
    Exact reproduction was never available — the parent's own numbers are
    not reproducible by the parent. A numeric mismatch is therefore not a
    failure of this project. Record neutrally in reference/AUDIT.md.

  parent_design:
    n_sim: 300
    BWS_sweep: {n: [50, 100, 200], p: [5, 10], cases: 4}
    saves: >
      BWS_simulation.R writes per-replication arrays, so whole
      distributions can be compared, not only means.

  stage_A:
    name: like-for-like
    n_sim: 300
    criterion: >
      |theirs - mine| < 3 * SE_combined, where
      SE_combined = sd * sqrt(1/300 + 1/300) ~ sd/12.
    purpose_and_limit: >
      This band is roughly a quarter of a standard deviation — wide.
      Stage A catches gross pipeline errors and proves the thing runs.
      IT CANNOT CERTIFY AGREEMENT. Do not report it as though it does.

  stage_B:
    name: sharp test
    when: after Stage A passes
    n_sim: 3000+               # time one config at 300 before committing
    criterion: >
      With own error effectively negligible, test whether each published
      figure is consistent with one 300-draw sample from the measured
      distribution: |theirs - mine| < 2 * sd/sqrt(300).

  highest_value_check: >
    Before anything else in the APP-FIN scripts runs: determine which
    loss ranks RFM against LFM/LOCF/EWMA. Confirmed present in the
    scripts are squared Bures-Wasserstein, Frobenius, a subspace
    distance, and a GMV portfolio risk error. If the BW-based rankings
    and the Frobenius-based rankings ever disagree, that is a live
    instance of P1-LOSS in a published comparison.


# ---------------------------------------------------------------------
# FORECAST COMPARISON — framing locked, specification deferred
# ---------------------------------------------------------------------
forecast_comparison:
  status: framing-locked / specification-deferred
  defer_reason: >
    Real-data design blocked on the panel question; positive-control
    pattern cannot be well designed until estimator behaviour is known.
    Revisit at Phase 5.

  framing_verbatim: >
    "Is their assumption leaving information on the table for prediction
    and estimation?"

  interpretive_commitments:
    - >
      This tests whether the fixed-centre restriction is COSTLY IN
      PREDICTION, not whether it is FALSE. By ID-6, no amount of forecast
      improvement licenses the claim that the centre moves.
    - >
      A flexible but misspecified model can dominate a correctly
      specified one. The moving-centre model has more capacity and could
      win by acting as a better smoother rather than by capturing
      structure.
    - >
      ASYMMETRY: a null result is equally uninformative. Failure to beat
      the fixed-centre model is NOT evidence that the centre is fixed.
    - >
      Route to a stronger claim, if one becomes available: P-DRIFT case 3
      predicts orthogonal drift inflates recovered dimension by exactly
      dim P_{S_X-perp} D. That is the only theorem-backed positive
      empirical signature in the canon. Any narrowing of the claim goes
      through it, as a dated append — never as an edit to the above.

  two_sided_design:
    principle: locked now, parameters later
    placebo:
      dgp: provably FIXED centre
      reads: >
        If the moving-centre model still wins, the advantage is capacity,
        not structure.
    positive_control:
      dgp: provably MOVING centre, realistic movement pattern
      reads: >
        If the moving-centre model does NOT win, the estimator is
        underpowered or broken.
      why_it_matters_more: >
        Without it, a null on real data is uninterpretable. If drift
        cannot be detected on data built to contain drift, "no
        improvement on the S&P panel" says nothing about the S&P panel.
      intended_output: >
        A detection-threshold curve — the smallest drift resolvable at
        n=240 — compared against plausible real drift. This tells you
        BEFORE touching the data whether the flagship application can
        resolve anything at all.
    deferred: [drift pattern, magnitude grid, persistence grid, split dates, panel, horizon]
