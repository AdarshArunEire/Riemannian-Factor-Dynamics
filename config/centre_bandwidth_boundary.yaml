# Exploratory continuation of the completed B4.2 bandwidth tuning.
#
# The original 1.3--2.1 tuning table and frozen selection are immutable
# reference data.  The fixed-overlap estimator requires bandwidth < 1/3,
# so the admissible multiplier ceiling depends on n:
#
#     c_b < (2/3) n^(1/7).
#
# This makes 2.2--2.4 inadmissible at n=4096 but admissible at n=8192.

experiment:
  id: B4.2-bandwidth-boundary
  root_seed: 20260820
  geometry: airm
  matrix_size: 3
  base_eigenvalues: [1.0, 1.25, 1.6]
  drift_direction_diagonal: [-1.0, 0.25, 0.75]
  centre_profile: cubic
  drift_scale: 0.35
  noise_scale: 0.25
  noise_persistence: 0.0
  noise_constant_norm: true
  factor_rank: 0

estimator:
  bandwidth_exponent: 0.14285714285714285
  bandwidth_constant: 0.5
  polygon_rate_exponent: 0.42857142857142855
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 100

discrepancy:
  amplitude: 0.5
  profile: smooth_coherent

analysis:
  primary_metric: path_rms
  reference_slope: -0.42857142857142855
  compatibility_band: [-0.50, -0.36]
  minimum_success_fraction: 1.0

profiles:
  boundary_4096:
    recorded: false
    stage: exploratory-boundary
    seed_namespace: 4204
    output_dir: results/intermediate/centre_bandwidth_boundary_n4096
    n_values: [4096]
    replicates: 32
    bandwidth_multipliers: [2.12, 2.15, 2.18]
    regimes: [full]
    discrepancy_exponents: []
    slope_fit_n_min: 4096
    bootstrap_replicates: 1000

  boundary_8192:
    recorded: false
    stage: exploratory-boundary
    seed_namespace: 4205
    output_dir: results/intermediate/centre_bandwidth_boundary_n8192
    n_values: [8192]
    replicates: 32
    bandwidth_multipliers: [2.2, 2.3, 2.4]
    regimes: [full]
    discrepancy_exponents: []
    slope_fit_n_min: 8192
    bootstrap_replicates: 1000
