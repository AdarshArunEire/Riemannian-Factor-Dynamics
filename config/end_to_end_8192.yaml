# B4.5 / N-01 outcome-independent n=8192 extension.
#
# This file is deliberately separate from end_to_end.yaml.  The completed
# namespace-4501 output records the digest of that original configuration;
# appending a profile to it would invalidate its metadata lock.  All scientific
# settings below are copied unchanged.  Only n, output path and seed namespace
# differ.

experiment:
  id: B4.5-end-to-end-8192-extension
  root_seed: 20260821
  geometry: airm
  base_condition: 1.6
  drift_scale: 0.35
  centre_profile: cubic
  factor_rank: 2
  factor_persistence: [0.80, 0.55]
  factor_scale: [0.35, 0.25]
  noise_scale: 0.20
  noise_persistence: 0.0
  noise_constant_norm: true
  loading_orientation: random
  loading_structure: dense

estimator:
  bandwidth_exponent: 0.14285714285714285
  bandwidth_constant: 0.5
  production_multiplier_cap: 2.1
  admissible_boundary_fraction: 0.95
  reference_multiplier: 1.3
  polygon_rate_exponent: 0.42857142857142855
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 100
  max_lag: 2
  tail_mode: common
  normalization: row_size
  selector_constant: 0.01
  selector_exponent: 0.42857142857142855
  selector_max_rank: 5

analysis:
  minimum_success_fraction: 0.95
  slope_fit_n_min: 512
  bootstrap_replicates: 1000

profiles:
  factor_baseline_8192:
    recorded: true
    seed_namespace: 4502
    output_dir: results/intermediate/end_to_end_factor_baseline_8192
    n_values: [8192]
    matrix_sizes: [2, 3, 4]
    replicates: 32
    # Summaries and plots combine these already-completed rows with the new
    # extension. Raw namespace-4502 rows remain in their own output directory.
    analysis_include_raw:
      - results/intermediate/end_to_end_factor_baseline/raw.csv

