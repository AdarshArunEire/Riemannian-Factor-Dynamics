# B4.2 finite-sample bandwidth tuning and fresh validation.
#
# This is deliberately separate from centre_rate.yaml: editing that file would
# change the digest protecting the completed B4.2/N-LS-A outputs.

experiment:
  id: B4.2-bandwidth
  root_seed: 20260820
  geometry: airm
  matrix_size: 3
  base_eigenvalues: [1.0, 1.25, 1.6]
  drift_direction_diagonal: [-1.0, 0.25, 0.75]
  centre_profile: cubic
  drift_scale: 0.35
  noise_scale: 0.25
  noise_persistence: 0.0
  noise_constant_norm: true
  factor_rank: 0

estimator:
  bandwidth_exponent: 0.14285714285714285   # 1/7
  bandwidth_constant: 0.5
  polygon_rate_exponent: 0.42857142857142855 # 3/7
  polygon_cell_constant: 1.0
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  mean_tolerance: 1.0e-10
  mean_max_iter: 100

discrepancy:
  amplitude: 0.5
  profile: smooth_coherent

analysis:
  primary_metric: path_rms
  reference_slope: -0.42857142857142855
  compatibility_band: [-0.50, -0.36]
  minimum_success_fraction: 1.0

selection:
  metric: path_rms
  cell_summary: median
  aggregate_across_n: mean_log
  tie_break: smaller_multiplier
  baseline_multiplier: 1.0
  boundary_policy: report_constrained_winner

profiles:
  bandwidth_tune:
    recorded: false
    stage: tuning
    seed_namespace: 4201
    output_dir: results/intermediate/centre_bandwidth_tuning
    n_values: [4096, 8192]
    replicates: 32
    bandwidth_multipliers: [1.3, 1.5, 1.7, 1.9, 2.1]
    regimes: [full]
    discrepancy_exponents: []
    slope_fit_n_min: 4096
    bootstrap_replicates: 1000

  bandwidth_validate:
    recorded: true
    stage: validation
    seed_namespace: 4202
    output_dir: results/intermediate/centre_bandwidth_validation
    n_values: [4096, 8192]
    replicates: 64
    # The orchestrator replaces this placeholder with [1.0, frozen winner].
    bandwidth_multipliers: [1.0]
    regimes: [full]
    discrepancy_exponents: []
    slope_fit_n_min: 4096
    bootstrap_replicates: 2000
