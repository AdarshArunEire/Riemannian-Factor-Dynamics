# Final Paper 1 real-data illustration: fixed-centre parent RFM versus
# moving-centre RFD on the same rebuilt 12-stock monthly covariance panel.
#
# This is intentionally not a forecasting or rank-selection experiment.
# Rank two is the primary descriptive specification because it is the rank
# used by the parent APP-FIN forecast. Ranks 1,...,15 form a sensitivity curve.

experiment:
  id: P1-APPFIN-ID
  panel_path: results/raw/rc_panel_adjusted.npz
  vix_path: reference/Riemannian_factor_model-main/sp500_covariance/VIXCLS.csv
  expected_months: 240
  expected_first_month: 2000-01
  expected_last_month: 2019-12
  expected_tickers: [MSFT, AAPL, ORCL, CSCO, JPM, BAC, WFC, GS, XOM, CVX, COP, EOG]
  covariance_scale: 10000.0
  primary_rank: 2
  sensitivity_max_rank: 15
  max_lag: 6

rfd:
  bandwidth_exponent: 0.14285714285714285
  bandwidth_constant: 0.5
  production_multiplier_cap: 2.1
  admissible_boundary_fraction: 0.95
  overlap_fractions: [0.3333333333333333, 0.6666666666666666]
  polygon_rate_exponent: 0.42857142857142855
  polygon_cell_constant: 1.0
  mean_tolerance: 1.0e-10
  mean_max_iterations: 200
  # Canonical BW reconstruction safeguard. Activation is always reported;
  # if it persists, no unregularized reconstruction claim is made.
  reconstruction_step_margin: 0.05
  tail_mode: common
  normalization: row_size

parent:
  batch_size: 30
  budget_iterations: 100
  verified_mean_tolerance: 1.0e-10
  verified_mean_max_iterations: 500
  seed: 1

output:
  directory: results/intermediate/appfin_identification
